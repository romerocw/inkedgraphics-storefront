<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
    <div style="background:{{ brand_color|default:"#111827" }};padding:16px 24px;">
      <span style="color:#ffffff;font-size:18px;font-weight:700;">{{ brand_name|default:"Inked Graphics" }}</span>
    </div>
    <div style="padding:24px;font-size:15px;line-height:1.55;">
      {% block body %}{% endblock %}
    </div>
  </div>
  <p style="max-width:560px;margin:16px auto 0;color:#6b7280;font-size:12px;line-height:1.5;">
    Inked Graphics Stores · <a href="{{ site_url }}" style="color:#6b7280;">{{ site_url }}</a>
  </p>
</body>
</html>
