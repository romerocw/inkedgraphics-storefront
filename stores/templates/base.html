{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inked Graphics Stores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'stores/site.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container">{% block header %}<a href="/" class="brand">Inked Graphics</a>{% endblock %} <a href="{% url 'cart' %}" class="cart-link">Cart</a></div>
  </header>
  <main class="container">
    {% if messages %}{% for m in messages %}<div class="msg msg-{{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer"><div class="container">Powered by Inked Graphics</div></footer>
</body>
</html>
