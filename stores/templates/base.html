{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inked Graphics Stores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'stores/site.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container">{% block header %}<a href="/" class="brand">Inked Graphics</a>{% endblock %}</div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="container">Powered by Inked Graphics</div></footer>
</body>
</html>
